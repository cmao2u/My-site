<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - Cmao2的秘密基地</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(145deg, #120f2e 0%, #0a1325 52%, #121d23 100%);
        background-size: 26px 26px, 26px 26px, 100% 100%;
        color: #eef2ff;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .panel {
        width: min(520px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(7, 17, 31, 0.9);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
        backdrop-filter: blur(18px);
      }

      .head {
        padding: 28px;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(168, 85, 247, 0.16), rgba(16, 185, 129, 0.12));
      }

      .eyebrow {
        margin: 0;
        color: #a5f3fc;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 0;
        font-size: 34px;
        line-height: 1.15;
      }

      .body {
        padding: 28px;
      }

      .qrcode {
        display: grid;
        place-items: center;
        width: 220px;
        height: 220px;
        margin: 0 auto 22px;
        border: 1px solid rgba(165, 243, 252, 0.32);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        padding: 10px;
      }

      .qrcode img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 4px;
        object-fit: contain;
      }

      .code {
        display: block;
        width: 100%;
        margin: 18px 0;
        padding: 18px;
        border: 1px solid rgba(165, 243, 252, 0.28);
        border-radius: 8px;
        background: rgba(8, 47, 73, 0.32);
        color: #ffffff;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 0;
        text-align: center;
      }

      .hint,
      .status {
        margin: 0;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.8;
      }

      .status {
        margin-top: 16px;
        color: #fef3c7;
      }

      button {
        width: 100%;
        margin-top: 22px;
        border: 1px solid rgba(165, 243, 252, 0.32);
        border-radius: 8px;
        padding: 12px 16px;
        background: rgba(165, 243, 252, 0.12);
        color: #ecfeff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: rgba(165, 243, 252, 0.18);
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section class="head">
        <p class="eyebrow">WECHAT LOGIN</p>
        <h1>进入 Cmao2的秘密基地</h1>
      </section>

      <section class="body">
        <div class="qrcode">
          <img src="/images/wechat-qrcode.jpg" alt="公众号二维码" />
        </div>

        <p class="hint">请关注公众号后发送下面这条消息：</p>
        <strong id="code" class="code">----</strong>
        <p id="instruction" class="hint">正在生成登录码...</p>
        <p id="status" class="status">请稍等。</p>
        <button id="refresh" type="button">重新获取登录码</button>
      </section>
    </main>

    <script>
      const codeEl = document.getElementById("code");
      const instructionEl = document.getElementById("instruction");
      const statusEl = document.getElementById("status");
      const refreshButton = document.getElementById("refresh");
      const params = new URLSearchParams(location.search);
      const returnTo = params.get("return") || "/";
      let code = "";
      let pollTimer = 0;

      function safeReturnPath(value) {
        if (!value || !value.startsWith("/") || value.startsWith("//")) {
          return "/";
        }

        if (value.startsWith("/login.html")) {
          return "/";
        }

        return value;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      async function createCode() {
        clearInterval(pollTimer);
        codeEl.textContent = "----";
        instructionEl.textContent = "正在生成登录码...";
        setStatus("请稍等。");

        const response = await fetch("/api/login/create", {
          method: "POST",
          credentials: "include",
        });

        if (!response.ok) {
          throw new Error("create failed");
        }

        const data = await response.json();
        code = data.code;
        codeEl.textContent = code;
        instructionEl.textContent = `发送：登录${code}`;
        setStatus("等待公众号确认，每 1.5 秒自动检查一次。");
        pollTimer = window.setInterval(checkStatus, 1500);
      }

      async function checkStatus() {
        if (!code) {
          return;
        }

        const response = await fetch(`/api/login/status?code=${encodeURIComponent(code)}`, {
          credentials: "include",
        });

        if (response.status === 410 || response.status === 404) {
          clearInterval(pollTimer);
          setStatus("登录码已失效，请重新获取。");
          return;
        }

        if (!response.ok) {
          setStatus("暂时无法确认登录状态，正在继续尝试。");
          return;
        }

        const data = await response.json();
        if (data.status === "success") {
          clearInterval(pollTimer);
          setStatus("登录成功，正在进入网站。");
          location.href = safeReturnPath(returnTo);
          return;
        }

        setStatus("还没有收到公众号确认，请发送上面的登录消息。");
      }

      refreshButton.addEventListener("click", () => {
        createCode().catch(() => {
          setStatus("登录码生成失败，请稍后重试。");
        });
      });

      createCode().catch(() => {
        setStatus("登录码生成失败，请稍后重试。");
      });
    </script>
  </body>
</html>
